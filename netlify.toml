# Netlify configuration for the "Deploy to Netlify" button.
#
# Netlify reads this from the repository root, so it lives here rather than
# inside tracker-public/. There is no build step: the site is one HTML file
# and the folder is published as-is.

[build]
  publish = "tracker-public"

[[headers]]
  for = "/*"

  [headers.values]
    # The page is nobody's iframe, and there is no reason to leak the URL —
    # which is the address of someone's job search — to anywhere it links.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

    # 'unsafe-eval' is required: Babel Standalone compiles the JSX in the page
    # at runtime. 'unsafe-inline' covers the page's own inline scripts and the
    # styles Tailwind's CDN build injects.
    #
    # connect-src has to stay open to https/wss because every user points the
    # page at their own Supabase project, and some are on custom domains.
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      font-src 'self' data:; \
      connect-src 'self' https: wss:; \
      base-uri 'self'; \
      form-action 'none'; \
      frame-ancestors 'none'"""

# The publishable Supabase key is meant to be public, but the page itself has
# no reason to be cached hard while people are still setting it up.
[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
