# Netlify configuration for the "Deploy to Netlify" button.
#
# Netlify reads this from the repository root, so it lives here rather than
# inside tracker-public/. There is no build step: the site is one HTML file
# and the folder is published as-is.

[build]
  publish = "tracker-public"

[[headers]]
  for = "/*"

  [headers.values]
    # The page is nobody's iframe, and there is no reason to leak the URL —
    # which is the address of someone's job search — to anywhere it links.
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

    # 'unsafe-eval' is required: Babel Standalone compiles the JSX in the page
    # at runtime. 'unsafe-inline' covers the page's own inline scripts and its
    # inlined stylesheet.
    #
    # Tailwind is no longer listed: it is built ahead of time and inlined, so
    # cdn.tailwindcss.com is not contacted at all.
    #
    # connect-src has to stay open to https/wss because every user points the
    # page at their own Supabase project, and some are on custom domains.
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; \
      style-src 'self' 'unsafe-inline'; \
      img-src 'self' data:; \
      font-src 'self' data:; \
      connect-src 'self' https: wss:; \
      base-uri 'self'; \
      form-action 'none'; \
      frame-ancestors 'none'"""

# The HTML must never be served from cache without asking first — a visitor
# pinned to yesterday's index.html is running yesterday's application, which
# is the whole failure this project is trying to avoid.
#
# Declared for BOTH paths on purpose. Netlify matches these rules against the
# request path, and nobody types /index.html — they open the bare origin. A
# rule written only for /index.html may never be consulted for the URL people
# actually visit. Netlify's own default for HTML happens to be the same value,
# but a guarantee this important should not rest on somebody else's default.
[[headers]]
  for = "/"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
